<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence Lite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cadence Lite</title>
<style>
  :root{
    --bg:#0B0D12; --panel:#12151D; --panel2:#171B25;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.17);
    --ink:#E9ECF4; --muted:#98A0B3; --faint:#5C6577;
    --accent:#35E0C6; --accent-ink:#06131A; --amber:#E8A33D;
    --ok:#4CC98B; --danger:#FF6B5E; --scrim:rgba(4,6,10,.72);
    --onbg:rgba(53,224,198,.09);
  }
  :root[data-theme="light"]{
    --bg:#F5F4F1; --panel:#FFFFFF; --panel2:#EFEDE8;
    --line:#E4E1D9; --line2:#CFCABD;
    --ink:#1D2129; --muted:#5F6674; --faint:#9AA0AC;
    --accent:#0E9E8B; --accent-ink:#FFFFFF; --amber:#B4761B;
    --ok:#1F8A55; --danger:#C0392B; --scrim:rgba(20,22,26,.42);
    --onbg:rgba(14,158,139,.10);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F4F1; --panel:#FFFFFF; --panel2:#EFEDE8;
      --line:#E4E1D9; --line2:#CFCABD;
      --ink:#1D2129; --muted:#5F6674; --faint:#9AA0AC;
      --accent:#0E9E8B; --accent-ink:#FFFFFF; --amber:#B4761B;
      --ok:#1F8A55; --danger:#C0392B; --scrim:rgba(20,22,26,.42);
      --onbg:rgba(14,158,139,.10);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 16px calc(28px + env(safe-area-inset-bottom));
       padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto}
  .hidden{display:none !important}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);
         border-radius:10px;padding:9px 14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  button.on{border-color:var(--accent);color:var(--accent);font-weight:650}
  button:disabled{opacity:.45;cursor:default}
  input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);
        border-radius:10px;padding:10px 12px;width:100%}
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center}
  .linky{background:none;border:none;color:var(--faint);font-size:12px;padding:2px 0;text-decoration:underline}
  .linky:hover{color:var(--accent);border:none}

  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px}
  .mark{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.26em;font-size:12px}
  .mark i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .hr{display:flex;align-items:center;gap:9px}
  .pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;
        border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
  .pill.amber{color:var(--amber);border-color:var(--amber)}
  .iconbtn{background:none;border:none;color:var(--muted);padding:4px}
  .iconbtn:hover{color:var(--accent);border:none}

  /* frog */
  .frog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;padding:11px 13px;
        border:1px solid var(--line2);border-radius:13px;background:var(--panel)}
  .frog.hot{border-color:var(--amber);box-shadow:0 0 20px -8px var(--amber)}
  .frog.eaten{opacity:.75;border-color:var(--ok)}
  .frog .em{font-size:18px;line-height:1}
  .frog .ft{flex:1;min-width:0;font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frog.eaten .ft{text-decoration:line-through;color:var(--muted)}
  .frog .sub{flex-basis:100%;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .fpick{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pick{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line2);
        border-radius:999px;font-size:12.5px;color:var(--muted);cursor:pointer;background:var(--panel2);
        max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick:hover{border-color:var(--accent);color:var(--accent)}
  .pick.frogpick{border-color:var(--amber)}

  /* the now bar - the whole point of the app */
  .now{margin:12px 0 0;padding:14px 15px 13px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);
       transition:border-color .2s, box-shadow .2s}
  .now.on{border-color:var(--accent);box-shadow:0 0 28px -10px var(--accent);background:linear-gradient(180deg,var(--onbg),transparent 70%),var(--panel)}
  .now .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .now.on .lbl{color:var(--accent)}
  .now .top{display:flex;align-items:baseline;gap:12px;margin-top:2px}
  .now .title{flex:1;min-width:0;font-size:17px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
  .now:not(.on) .title{color:var(--muted);font-weight:500}
  .now .clk{font-size:32px;font-weight:250;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:0 0 auto;line-height:1}
  .now .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .now .btns{display:flex;gap:8px;margin-top:12px;align-items:center}
  .now .btns button{flex:1}
  .now .btns .linky{flex:0 0 auto;padding:0 4px}
  .go{display:flex;gap:8px;margin:12px 0 0}
  .go button{flex:0 0 auto;white-space:nowrap}

  /* sections */
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
     margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  h2 span{color:var(--muted);letter-spacing:0;text-transform:none;font-size:12px}
  .card{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden}
  .item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .t{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto;width:84px}
  .item .n{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:11.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .item.live{background:var(--onbg)}
  .item.live .n{color:var(--accent);font-weight:600}
  .item .x{background:none;border:none;color:var(--faint);padding:2px 4px;font-size:12px}
  .item .x:hover{color:var(--danger);border:none}
  .empty{padding:14px 13px;color:var(--faint);font-size:12.5px}
  .chk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line2);background:none;
       color:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0;flex:0 0 auto}
  .chk:hover{border-color:var(--ok);color:var(--ok)}
  .addrow{display:flex;gap:8px;padding:10px 13px;border-top:1px solid var(--line)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px}

  /* task rows: tap = be on it; tap the lit one = off */
  .task{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .task:hover{background:var(--panel2)}
  .task .n{font-size:14px;white-space:normal;line-height:1.35}
  .task .m{color:var(--faint)}
  .task .pr{font-size:10.5px;color:var(--amber);flex:0 0 auto;font-weight:700;width:20px}
  .task .go{color:var(--faint);font-size:12px;flex:0 0 auto;width:18px;text-align:center}
  .task.on{background:var(--onbg);box-shadow:inset 3px 0 0 var(--accent)}
  .task.on .n{color:var(--accent);font-weight:650}
  .task.on .go{color:var(--accent);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.2}}
  .grp{padding:7px 13px 3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
       border-bottom:1px solid var(--line);background:var(--panel2)}
  .more{display:block;width:100%;background:none;border:none;border-top:1px solid var(--line);border-radius:0;
        color:var(--faint);font-size:12px;padding:9px}
  .more:hover{color:var(--accent)}

  /* past entry */
  .past{margin-top:10px;padding:12px 13px;border:1px dashed var(--line2);border-radius:13px}
  .past .g{display:flex;gap:8px;margin-top:8px}
  .past .g input{flex:1}
  .past .seg{display:flex;gap:8px;margin-top:8px}
  .past .seg button{flex:1}

  /* settings sheet */
  #settings{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .sbox{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-bottom:none;
        border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
        animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sbox h3{margin:0 0 3px;font-size:16px}
  .opt{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
  .opt:last-of-type{border-bottom:none}
  .opt .hint{display:block;font-size:11.5px;color:var(--faint)}
  .sw{position:relative;width:42px;height:24px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
  .sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;transition:.15s}
  .sw i::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:var(--muted);top:2.5px;left:3px;transition:.15s}
  .sw input:checked + i{background:var(--accent);border-color:var(--accent)}
  .sw input:checked + i::after{left:20px;background:var(--accent-ink)}
  .seg{display:flex;gap:6px}
  .seg button{padding:6px 12px;font-size:12.5px}

  /* login */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  .lbox{width:100%;max-width:330px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .lbox .mark{justify-content:center;margin-bottom:6px}
  .lbox p{color:var(--muted);font-size:13px;margin:0 0 4px}
  .err{color:var(--danger);font-size:12.5px;min-height:16px}

  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
         background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;
         opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="mark"><i></i>CADENCE LITE</div>
    <p>Sign in - the same account as Cadence.</p>
    <input type="email" id="email" placeholder="email" autocomplete="username">
    <input type="password" id="password" placeholder="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
    <button class="linky hidden" id="offBoot">continue offline with cached data</button>
  </div>
</div>

<div id="app" class="hidden"><div class="wrap">
  <header>
    <div class="mark"><i></i>CADENCE LITE</div>
    <div class="hr">
      <span class="pill hidden" id="syncPill"></span>
      <span class="pill" id="today"></span>
      <button class="iconbtn" id="gear" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="frog hidden" id="frogBar"></div>

  <div class="now" id="nowBar">
    <div class="lbl" id="nowLbl">Off</div>
    <div class="top">
      <div class="title" id="nowTitle">Not on anything</div>
      <div class="clk" id="nowClk"></div>
    </div>
    <div class="sub" id="nowSub">Tap a task to be on it. Tap another to switch.</div>
    <div class="btns hidden" id="nowBtns">
      <button class="primary" id="doneBtn">✓ Done</button>
      <button id="offBtn">■ Off</button>
      <button class="linky" id="discardBtn">discard</button>
    </div>
  </div>

  <div class="go">
    <input type="text" id="plan" placeholder="On something else? type it" autocomplete="off">
    <button class="primary" id="goBtn">On it</button>
  </div>

  <h2>Tasks <span id="taskCount"></span></h2>
  <div class="card">
    <div id="taskList"></div>
    <button class="more hidden" id="moreBtn"></button>
    <div class="addrow">
      <input type="text" id="taskAdd" placeholder="add a task (without starting it)" autocomplete="off">
      <button id="taskAddBtn">Add</button>
    </div>
  </div>

  <h2>Today <span id="todayTotal"></span></h2>
  <div class="card" id="todayCard"></div>

  <div class="foot">
    <button class="linky" id="pastToggle">+ log time already spent</button>
    <span style="font-size:11px;color:var(--faint)" id="acct"></span>
  </div>
  <div class="past hidden" id="pastBox">
    <input type="text" id="pDesc" placeholder="What were you on?" autocomplete="off">
    <div class="g">
      <input type="time" id="pStart"><input type="time" id="pEnd">
    </div>
    <div class="seg">
      <button class="primary" id="pLog">Log it</button>
      <button id="pCancel">cancel</button>
    </div>
  </div>
</div></div>

<div id="settings" class="hidden">
  <div class="sbox">
    <h3>Settings</h3>
    <div class="opt"><span>Theme</span>
      <div class="seg"><button id="thDark">Dark</button><button id="thLight">Light</button></div>
    </div>
    <div class="opt"><span>Chime while on a task<span class="hint">a soft ding at each interval; never blocks</span></span>
      <div class="seg" id="chimeSeg">
        <button data-chime="0">Off</button><button data-chime="10">10</button><button data-chime="20">20</button><button data-chime="30">30</button>
      </div>
    </div>
    <div class="opt"><span>Sound</span><label class="sw"><input type="checkbox" id="swSound"><i></i></label></div>
    <div class="opt"><span>Version</span>
      <div class="seg"><button id="vFull">Full</button><button id="vLite" class="on">Lite</button></div>
    </div>
    <div class="opt"><span>Account</span><button class="linky" id="signOut">Sign out</button></div>
    <button class="primary" id="setDone" style="width:100%;margin-top:14px">Done</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = "https://snglqwfngmkhxtsvxuvp.supabase.co";
  var SUPABASE_KEY = "sb_publishable_HHHnwWx1BJ8l4uMbxt1XjQ_Mfwekcod";
  var SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- one Dock icon, two versions ----
  // Both apps sit inside the installed PWA's scope (/cadence-web/), so switching
  // navigates within the same window. The choice is remembered in localStorage,
  // which is shared per-origin, so either app can read it. The sessionStorage
  // guard allows at most ONE redirect per launch — no ping-pong loops.
  var VIEW = "lite";
  var REDIRECTING = (function(){
    try{
      var want = localStorage.getItem("cadence_view");
      if(want && want !== VIEW && !sessionStorage.getItem("cad_switched")){
        sessionStorage.setItem("cad_switched", "1");
        location.replace(want === "lite" ? "lite/" : "../");
        return true;
      }
    }catch(e){}
    return false;
  })();
  function switchVersion(v){
    try{ localStorage.setItem("cadence_view", v); sessionStorage.setItem("cad_switched","1"); }catch(e){}
    if(v !== VIEW) location.href = (v === "lite" ? "lite/" : "../");
  }

  // TRACKER MODE (2026-09-04). Cadence Lite records WHICH task you're on and
  // WHEN. Tap a task = you're on it; tap another = switch (the previous block
  // closes with its measured minutes); tap the lit one = off. The timer is now
  // an optional chime. Rows are the full app's stopwatch shape, so the full app,
  // the companion and ~/Dev/cadence/track.py all read and write the same thing:
  //   state.mode = "stopwatch", state.due_at = START anchor, block_total = 0,
  //   blocks.mode = "stopwatch", interval_min = measured minutes once closed.
  var UID = null, EMAIL = "", st = null, TODAY = [], TASKS = [], FROGS = [], busy = false;
  var FROG_OK = false;                 // frogs table present
  var tickTimer = null, pollTimer = null, audioCtx = null;
  var OFFBOOT = false;
  var SHOW_N = 14;                     // task rows before "+N more"
  var TAG_ORDER = {focus:0, vix:1, adhoc:2, also:3, personal:4, unranked:8};
  var GROUP_LABEL = {ranked:"Ranked today", focus:"Focus", vix:"VIX", adhoc:"Added on the fly",
                     also:"Also", personal:"Personal", unranked:"Not ranked", untagged:"Other"};

  function $(id){ return document.getElementById(id); }
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
  function hm(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function hmin(m){ m=Math.round(m||0); var h=Math.floor(m/60); return h>0?(h+"h "+String(m%60).padStart(2,"0")+"m"):(m+"m"); }
  function clockUp(sec){ sec=Math.max(0,Math.floor(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
    return h>0 ? (h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")) : (String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")); }
  function dayKey(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function todayStartISO(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
  function cap(s){ s=(s||"").trim(); return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
  function trunc(s,n){ s=s||""; return s.length>n ? s.slice(0,n)+"…" : s; }
  function esc(t){ var d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }

  // ---------------- prefs ----------------
  var DEF = {theme:"dark", sound:true, chime:20, showAll:false};
  var prefs = (function(){
    try{ var p=JSON.parse(localStorage.getItem("cadlite_prefs")||"{}"), o=JSON.parse(JSON.stringify(DEF));
      if(p.theme==="light"||p.theme==="dark") o.theme=p.theme;
      if(typeof p.sound==="boolean") o.sound=p.sound;
      if(typeof p.chime==="number" && p.chime>=0) o.chime=p.chime;
      if(typeof p.showAll==="boolean") o.showAll=p.showAll;
      return o;
    }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
  })();
  function savePrefs(){ try{ localStorage.setItem("cadlite_prefs", JSON.stringify(prefs)); }catch(e){} }
  function applyPrefs(){
    document.documentElement.setAttribute("data-theme", prefs.theme);
    var tc=document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute("content", prefs.theme==="light" ? "#F5F4F1" : "#0B0D12");
    $("thDark").classList.toggle("on", prefs.theme==="dark");
    $("thLight").classList.toggle("on", prefs.theme==="light");
    $("swSound").checked = prefs.sound;
    document.querySelectorAll("#chimeSeg button").forEach(function(b){
      b.classList.toggle("on", parseInt(b.dataset.chime,10)===prefs.chime);
    });
  }

  // ---------------- chime ----------------
  function unlockAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function chime(){
    if(!prefs.sound || !audioCtx) return;
    try{ if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){}
    try{
      var t=audioCtx.currentTime;
      [880,1174.7].forEach(function(f,i){
        var o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.frequency.value=f; o.type="sine";
        g.gain.setValueAtTime(0.0001, t+i*0.16);
        g.gain.exponentialRampToValueAtTime(0.18, t+i*0.16+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.16+0.32);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t+i*0.16); o.stop(t+i*0.16+0.36);
      });
    }catch(e){}
  }
  var toastT=null;
  function toast(m,ms){ var t=$("toast"); t.textContent=m; t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); }, ms||3000); }
  // =============== [OB-BEGIN] offline data layer ===============
  // MIRROR: local copy of everything the UI shows, so the app renders offline.
  // OB: outbox of writes made offline, replayed in order on reconnect.
  // Offline inserts get temporary NEGATIVE ids; replay maps them to real ids
  // (OB.map) and substitutes them in later ops' foreign keys.
  var MIRROR = { st:null, blocks:[], tasks:[], frogs:[], flags:null };
  var OB = { ops:[], map:{}, seq:-2 };
  var DRAINING = false;
  var ID_KEYS = { id:1, session_id:1, block_id:1, task_id:1, active_session_id:1, active_block_id:1 };

  function mirKey(){ return "cadlite_mir_" + (UID||"anon"); }
  function obKey(){ return "cadlite_ob_" + (UID||"anon"); }
  function saveMirror(){ try{ localStorage.setItem(mirKey(), JSON.stringify(MIRROR)); }catch(e){} }
  function loadMirror(){ try{ var m=JSON.parse(localStorage.getItem(mirKey())||"null");
    if(m){ MIRROR=m; MIRROR.blocks=MIRROR.blocks||[]; MIRROR.tasks=MIRROR.tasks||[]; MIRROR.frogs=MIRROR.frogs||[]; return true; } }catch(e){} return false; }
  function saveOB(){ try{ localStorage.setItem(obKey(), JSON.stringify(OB)); }catch(e){} }
  function loadOB(){ try{ var o=JSON.parse(localStorage.getItem(obKey())||"null");
    if(o && o.ops){ OB=o; OB.map=OB.map||{}; if(typeof OB.seq!=="number") OB.seq=-2; } }catch(e){} }

  function netErr(e){
    if(navigator.onLine === false) return true;
    var m=((e&&e.message)||String(e||"")).toLowerCase();
    return /failed to fetch|networkerror|network request failed|load failed|fetch failed|timed?[ -]?out|abort|connection|err_internet/.test(m);
  }
  function authErr(e){
    var c=e&&(e.status||e.code), m=((e&&e.message)||"").toLowerCase();
    return c===401||c===403||/jwt|token|not.?authenticated|authorization/.test(m);
  }
  function offlineNow(){ return navigator.onLine === false || OB.ops.length > 0; }

  function mMatch(r,match){ for(var k in match){ if(r[k]!==match[k]) return false; } return true; }
  function mApply(op){
    if(op.table==="state"){ MIRROR.st = Object.assign({}, MIRROR.st||st||{}, op.row||op.patch||{}); st=MIRROR.st; return; }
    var arr=MIRROR[op.table]; if(!arr) return;      // sessions: not mirrored as an array
    if(op.kind==="ins"){ if(!arr.some(function(r){ return r.id===op.row.id; })) arr.push(op.row); }
    else if(op.kind==="upd"){ arr.forEach(function(r){ if(mMatch(r,op.match)) Object.assign(r,op.patch); }); }
    else if(op.kind==="del"){ MIRROR[op.table]=arr.filter(function(r){ return !mMatch(r,op.match); }); }
  }
  function rebuildFromMirror(renderIt){
    if(MIRROR.st) st=MIRROR.st;
    var iso=todayStartISO();
    TODAY=(MIRROR.blocks||[]).filter(function(b){ return b.status==="logged" && (b.planned_at||"")>=iso; })
      .map(toItem).sort(function(a,b){ return a.sort<b.sort?-1:1; });
    if(renderIt) render();
  }
  function extFromMirror(){
    // .slice(): these get mutated in place, so never alias the mirror's arrays
    TASKS=(MIRROR.tasks||[]).slice();
    FROGS=(MIRROR.frogs||[]).slice();
  }
  function obBadge(){
    var e=$("syncPill"); if(!e) return;
    var n=OB.ops.length;
    if(n){ e.textContent="⇡ "+n; e.classList.remove("hidden"); e.classList.add("amber"); }
    else if(navigator.onLine===false){ e.textContent="offline"; e.classList.remove("hidden"); e.classList.remove("amber"); }
    else e.classList.add("hidden");
  }
  function enqueue(kind,table,row,patch,match){
    var op={kind:kind,table:table};
    if(row)op.row=row; if(patch)op.patch=patch; if(match)op.match=match;
    OB.ops.push(op); saveOB(); mApply(op); saveMirror(); rebuildFromMirror(false); obBadge();
  }
  async function dbIns(table,row){
    if(!offlineNow()){
      try{ var q=await SB.from(table).insert(row).select().single();
        if(!q.error){ mApply({kind:"ins",table:table,row:q.data}); saveMirror(); return q; }
        if(!netErr(q.error)) return q;
      }catch(e){ if(!netErr(e)) throw e; }
    }
    var r=Object.assign({},row); r.id=OB.seq--;
    enqueue("ins",table,r); return {data:r,error:null,offline:true};
  }
  async function dbUpd(table,patch,match){
    if(!offlineNow()){
      try{ var q=await SB.from(table).update(patch).match(match);
        if(!q.error){ mApply({kind:"upd",table:table,patch:patch,match:match}); saveMirror(); return q; }
        if(!netErr(q.error)) return q;
      }catch(e){ if(!netErr(e)) throw e; }
    }
    enqueue("upd",table,null,patch,match); return {data:null,error:null,offline:true};
  }
  async function dbDel(table,match){
    if(!offlineNow()){
      try{ var q=await SB.from(table).delete().match(match);
        if(!q.error){ mApply({kind:"del",table:table,match:match}); saveMirror(); return q; }
        if(!netErr(q.error)) return q;
      }catch(e){ if(!netErr(e)) throw e; }
    }
    enqueue("del",table,null,null,match); return {data:null,error:null,offline:true};
  }
  function obResolveVal(v){ return (typeof v==="number" && v<0 && OB.map[v]!==undefined) ? OB.map[v] : v; }
  function obResolveObj(o){ if(!o) return o; var out={}; for(var k in o){ out[k]=ID_KEYS[k]?obResolveVal(o[k]):o[k]; } return out; }

  async function drainOutbox(){
    if(DRAINING || !OB.ops.length || navigator.onLine===false || !UID) return;
    try{ var s=await SB.auth.getSession(); if(!(s.data && s.data.session)) return; }catch(e){ return; }
    DRAINING=true;
    var synced=0, dropped=0;
    try{
      while(OB.ops.length){
        var op=OB.ops[0], res=null;
        try{
          if(op.kind==="ins"){
            var row=obResolveObj(op.row), tid=op.row.id;
            if(typeof row.id==="number" && row.id<0) delete row.id;
            res=await SB.from(op.table).insert(row).select().single();
            if(!res.error && typeof tid==="number" && tid<0) OB.map[tid]=res.data.id;
          } else if(op.kind==="upd"){
            res=await SB.from(op.table).update(obResolveObj(op.patch)).match(obResolveObj(op.match));
          } else if(op.kind==="del"){
            res=await SB.from(op.table).delete().match(obResolveObj(op.match));
          }
        }catch(e){ res={error:e}; }
        if(res && res.error){
          if(netErr(res.error) || authErr(res.error)) break;   // retry forever on these
          op.fails=(op.fails||0)+1;
          if(op.fails>=3){ OB.ops.shift(); dropped++; } else break;
        } else { OB.ops.shift(); synced++; }
        saveOB();
      }
    } finally { DRAINING=false; }
    saveOB(); obBadge();
    if(!OB.ops.length && (synced||dropped)){
      OB.map={}; saveOB();
      toast(dropped ? ("Synced "+synced+" — "+dropped+" couldn't be saved") : "Offline work synced ✓");
      await refresh(); await refreshExt();
    }
  }
  // =============== [OB-END] offline data layer ===============

  // ---------------- auth ----------------
  async function init(){
    applyPrefs();
    var res=null; try{ res=await SB.auth.getSession(); }catch(e){}
    var sess=res && res.data && res.data.session;
    if(sess) onLogin(sess);
    else{
      var cu=null; try{ cu=localStorage.getItem("cadlite_uid"); }catch(e){}
      if(cu && navigator.onLine===false) bootOffline(cu); else showLogin();
    }
    SB.auth.onAuthStateChange(function(_e,s){ if(s) onLogin(s); else if(!OFFBOOT) showLogin(); });
  }
  function showLogin(){
    $("app").classList.add("hidden"); $("login").classList.remove("hidden");
    var cu=null; try{ cu=localStorage.getItem("cadlite_uid"); }catch(e){}
    if(cu) $("offBoot").classList.remove("hidden");
  }
  function bootOffline(uid){
    OFFBOOT=true; UID=uid;
    try{ EMAIL=localStorage.getItem("cadlite_email")||""; }catch(e){ EMAIL=""; }
    $("acct").textContent=EMAIL+" (offline)";
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    loadOB(); loadMirror();
    FROG_OK=!!(MIRROR.flags && MIRROR.flags.frog);
    st=MIRROR.st||{interval_min:20, block_index:0};
    rebuildFromMirror(false); extFromMirror(); render(); obBadge();
    startTimers();
  }
  async function onLogin(session){
    OFFBOOT=false;
    UID=session.user.id; EMAIL=session.user.email||"";
    try{ localStorage.setItem("cadlite_uid",UID); localStorage.setItem("cadlite_email",EMAIL); }catch(e){}
    $("acct").textContent=EMAIL;
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    loadOB(); loadMirror();
    await ensureState(); await probe(); await refresh(); await refreshExt();
    applyPrefs(); obBadge(); render();
    startTimers();
  }
  function startTimers(){
    if(!tickTimer) tickTimer=setInterval(tick,1000);
    if(!pollTimer) pollTimer=setInterval(function(){ refresh(); }, 6000);
    setInterval(function(){ if(!busy) refreshExt(); }, 30000);   // tasks pushed in by track.py / the syncs
  }
  async function doLogin(){
    $("loginErr").textContent="";
    var r=await SB.auth.signInWithPassword({email:$("email").value.trim(), password:$("password").value});
    if(r.error) $("loginErr").textContent=r.error.message;
  }
  async function ensureState(){

    if(r && r.error){ st=MIRROR.st||{interval_min:20, block_index:0}; return; }
    await SB.from("state").insert({user_id:UID, interval_min:20});
    r=await SB.from("state").select("*").eq("user_id",UID).maybeSingle();
    st=(r&&r.data)||{interval_min:20, block_index:0};
    MIRROR.st=st; saveMirror();
  }
  async function probe(){
    var mf=MIRROR.flags||{};
    try{ var r=await SB.from("frogs").select("id").limit(1);
      FROG_OK = r.error ? (netErr(r.error) ? !!mf.frog : false) : true; }
    catch(e){ FROG_OK = netErr(e) ? !!mf.frog : false; }
    MIRROR.flags={frog:FROG_OK}; saveMirror();
  }

  // ---------------- read ----------------
  function toItem(b){
    return {id:b.id, sort:b.planned_at, startHM:hm(b.planned_at), endHM:hm(b.logged_at||b.planned_at),
            planned:(b.planned||"").trim(), rating:(b.rating||"").trim(), minutes:b.interval_min||0,
            task_id:b.task_id||null, open:b.status!=="logged"};
  }
  async function refresh(){
    if(busy) return;
    drainOutbox();
    if(OB.ops.length || navigator.onLine===false){ rebuildFromMirror(true); obBadge(); return; }
    var sr=await SB.from("state").select("*").eq("user_id",UID).maybeSingle();
    if(sr.error){ rebuildFromMirror(true); obBadge(); return; }
    if(sr.data){ st=sr.data; MIRROR.st=st; }
    var b=await SB.from("blocks").select("*").gte("planned_at", todayStartISO()).order("id");
    if(b.error){ rebuildFromMirror(true); obBadge(); return; }
    MIRROR.blocks=b.data||[];
    TODAY=MIRROR.blocks.filter(function(x){ return x.status==="logged"; }).map(toItem);
    saveMirror(); obBadge(); render();
  }
  async function refreshExt(){
    if(offlineNow()){ extFromMirror(); render(); return; }
    try{
      var t=await SB.from("tasks").select("*").eq("status","open").order("id",{ascending:false}).limit(300);
      if(!t.error){ TASKS=t.data||[]; MIRROR.tasks=TASKS.slice(); }
    }catch(e){}
    if(FROG_OK){
      try{
        var y=new Date(Date.now()-864e5);
        var yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
        var f=await SB.from("frogs").select("*").gte("day",yk).order("day");
        if(!f.error){ FROGS=f.data||[]; MIRROR.frogs=FROGS.slice(); }
      }catch(e){}
    }

  }

  // ---------------- derived ----------------
  function rankKey(t){
    var pr=(t.priority==null)?999:t.priority;
    var tg=TAG_ORDER[(t.tag||"").toLowerCase()]; if(tg==null) tg=6;
    return [pr, tg, -(t.id||0)];
  }
  function sortedTasks(){
    return TASKS.slice().sort(function(a,b){ var ka=rankKey(a), kb=rankKey(b);
      for(var i=0;i<3;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; } return 0; });
  }
  function groupOf(t){ if(t.priority!=null) return "ranked"; return (t.tag||"").toLowerCase()||"untagged"; }
  function activeBlock(){
    if(!st||!st.active_block_id) return null;
    return (MIRROR.blocks||[]).filter(function(b){ return b.id===st.active_block_id; })[0]||null;
  }
  // The one derived fact everything renders from. Timer-mode blocks (started
  // in the full app) still show, counting up from their real start; nothing
  // here ever fires a blocking sheet.
  function status(){
    var now=Date.now();
    if(!st || !st.active_session_id) return {on:false};
    var anchor = st.due_at ? new Date(st.due_at).getTime() : now;
    var timer = (st.mode!=="stopwatch") && (st.block_total>0);
    var b=activeBlock();
    var startMs = (b && b.planned_at) ? new Date(b.planned_at).getTime() : (timer ? anchor-(st.block_total*1000) : anchor);
    return {on:true, plan:(st.block_plan||"").trim(), startMs:startMs, elapsedSec:Math.max(0,(now-startMs)/1000),
            timer:timer, endMs: timer ? anchor : null, blockId:st.active_block_id, taskId:(b&&b.task_id)||null};
  }
  function isActiveTask(t,s){
    if(!s.on) return false;
    if(s.taskId) return t.id===s.taskId;
    return (t.name||"").trim().toLowerCase()===s.plan.toLowerCase();
  }
  function minutesByTask(){
    var byId={}, byName={}, s=status();
    function add(id,name,m){ if(id) byId[id]=(byId[id]||0)+m; var k=(name||"").trim().toLowerCase(); if(k) byName[k]=(byName[k]||0)+m; }
    TODAY.forEach(function(it){ if(!it.open) add(it.task_id, it.planned, it.minutes); });
    if(s.on) add(s.taskId, s.plan, s.elapsedSec/60);
    return {byId:byId, byName:byName};
  }
  function findTask(name){
    name=(name||"").trim().toLowerCase(); if(!name) return null;
    var t=TASKS.filter(function(x){ return (x.name||"").trim().toLowerCase()===name; })[0];
    return t ? t.id : null;
  }
  // exact -> containing (ranked one wins) -> null. Typed text that matches
  // nothing becomes a new task, because what you're on must be on the list.
  function findTaskFuzzy(q){
    q=(q||"").trim().toLowerCase(); if(!q) return null;
    var list=sortedTasks();
    var ex=list.filter(function(x){ return (x.name||"").trim().toLowerCase()===q; })[0]; if(ex) return ex;
    return list.filter(function(x){ return (x.name||"").toLowerCase().indexOf(q)>=0; })[0]||null;
  }

  // ---------------- render ----------------
  function render(){
    if(!st) return;
    var s=status();
    $("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    $("nowBar").classList.toggle("on", s.on);
    $("nowBtns").classList.toggle("hidden", !s.on);
    if(s.on){
      $("nowLbl").textContent = s.timer ? "On · timer block" : "On";
      $("nowTitle").textContent = s.plan || "(untitled)";

      var sub="since "+hm(s.startMs);
      if(s.timer) sub += (s.endMs>Date.now() ? " · timer ends "+hm(s.endMs) : " · timer ended "+hm(s.endMs));
      else if(prefs.chime>0 && prefs.sound){ var per=prefs.chime*60; sub += " · chime in "+Math.max(1,Math.ceil((per-(s.elapsedSec%per))/60))+"m"; }
      $("nowSub").textContent=sub;
    } else {
      $("nowLbl").textContent="Off";
      $("nowTitle").textContent="Not on anything";
      $("nowClk").textContent="";
      $("nowSub").textContent = TASKS.length ? "Tap a task to be on it. Tap another to switch." : "Add a task below, then tap it.";
    }
    renderFrog(); renderTasks(); renderToday();
  }

  function frogToday(){ var k=dayKey(); return FROGS.filter(function(f){ return f.day===k; })[0]||null; }
  function renderFrog(){
    var bar=$("frogBar");
    if(!FROG_OK){ bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden","hot","eaten"); bar.innerHTML="";
    var t=frogToday();
    bar.appendChild(el("span","em","🐸"));
    if(!t){
      bar.appendChild(el("div","ft","Pick today's frog"));
      var pick=el("div","fpick");
      var y=(function(){ var d=new Date(Date.now()-864e5);
        var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        return FROGS.filter(function(f){ return f.day===k && !f.done; })[0]||null; })();
      var seen={};
      if(y){ var c0=el("span","pick frogpick","↻ "+trunc(y.title,26)); seen[y.title.toLowerCase()]=1;
        c0.addEventListener("click", function(){ setFrog(y.title); }); pick.appendChild(c0); }
      sortedTasks().slice(0,5).forEach(function(k){
        var lo=(k.name||"").toLowerCase(); if(!lo||seen[lo]) return; seen[lo]=1;
        var c=el("span","pick",trunc(k.name,28));
        c.addEventListener("click", function(){ setFrog(k.name); });
        pick.appendChild(c);
      });
      bar.appendChild(pick);
      return;
    }
    bar.classList.add(t.done ? "eaten" : "hot");
    bar.appendChild(el("div","ft",t.title));
    if(!t.done){
      var s=status();
      var onIt = s.on && s.plan.toLowerCase()===t.title.trim().toLowerCase();
      var go=el("button","", onIt ? "●" : "▶");
      go.title= onIt ? "You're on it" : "Be on the frog";
      go.addEventListener("click", function(){ if(!onIt) switchTo(t.title, findTask(t.title)); });
      bar.appendChild(go);
      var dn=el("button","","✓");
      dn.title="Frog swallowed";
      dn.addEventListener("click", eatFrog);
      bar.appendChild(dn);
    } else {
      bar.appendChild(el("span","sub","swallowed ✓"));
    }
  }

  function taskRow(t, on, mins){
    var row=el("div","item task"+(on?" on":""));
    var c=el("button","chk","✓"); c.title="Finished";
    c.addEventListener("click", function(e){ e.stopPropagation(); finishTask(t); });
    row.appendChild(c);
    if(t.priority!=null) row.appendChild(el("span","pr","#"+t.priority));
    row.appendChild(el("span","n",t.name));
    var m = mins.byId[t.id]!=null ? mins.byId[t.id] : (mins.byName[(t.name||"").trim().toLowerCase()]||0);
    if(m>=1) row.appendChild(el("span","m",hmin(m)+" today"));
    row.appendChild(el("span","go", on?"●":"▶"));

    return row;
  }
  function renderTasks(){
    var box=$("taskList"); box.innerHTML="";
    var list=sortedTasks(), s=status(), mins=minutesByTask();
    $("taskCount").textContent = list.length ? (list.length+" open") : "";
    if(!list.length){ box.appendChild(el("div","empty","No open tasks. Add one below, or they sync in from your list.")); $("moreBtn").classList.add("hidden"); return; }
    var shown = prefs.showAll ? list : list.slice(0,SHOW_N);
    if(!prefs.showAll && s.on){            // the task you're on is always visible
      var act=list.filter(function(t){ return isActiveTask(t,s); })[0];
      if(act && shown.indexOf(act)<0) shown.push(act);
    }
    var last=null;
    shown.forEach(function(t){
      var g=groupOf(t);
      if(g!==last){ box.appendChild(el("div","grp",GROUP_LABEL[g]||g)); last=g; }
      box.appendChild(taskRow(t, isActiveTask(t,s), mins));
    });
    var hidden=list.length-Math.min(list.length,SHOW_N);
    var mb=$("moreBtn"); mb.classList.toggle("hidden", hidden<=0);
    mb.textContent = prefs.showAll ? "show less" : ("+"+hidden+" more");
  }
  function renderToday(){
    var box=$("todayCard"); box.innerHTML="";
    var s=status();
    var items=TODAY.filter(function(it){ return !it.open; }).sort(function(a,b){ return a.sort<b.sort?1:-1; });
    var total=items.reduce(function(a,i){ return a+i.minutes; },0) + (s.on ? s.elapsedSec/60 : 0);
    $("todayTotal").textContent = total>=1 ? hmin(total) : "";
    if(s.on){
      var r0=el("div","item live");
      r0.appendChild(el("span","t",hm(s.startMs)+"–now"));
      r0.appendChild(el("span","n",s.plan));
      r0.appendChild(el("span","m",hmin(s.elapsedSec/60)));
      box.appendChild(r0);
    }
    if(!items.length && !s.on){ box.appendChild(el("div","empty","Nothing tracked yet today.")); return; }
    items.forEach(function(it){
      var r=el("div","item");
      r.appendChild(el("span","t",it.startHM+"–"+it.endHM));
      r.appendChild(el("span","n",it.planned));
      r.appendChild(el("span","m",hmin(it.minutes)));
      var x=el("button","x","✕"); x.title="Delete this entry";
      x.addEventListener("click", function(){ if(confirm("Delete this entry?")) delEntry(it); });
      r.appendChild(x);
      box.appendChild(r);
    });
  }

  // ---------------- tick ----------------
  var _chimed="";
  function tick(){
    if(!st) return;
    var s=status();
    render();
    if(!s.on || !prefs.sound) return;
    if(s.timer){                              // a full-app timer block: one ding when it ends, nothing modal
      if(s.endMs && Date.now()>=s.endMs && (Date.now()-s.endMs)<5000 && _chimed!==("t"+s.blockId)){ _chimed="t"+s.blockId; chime(); toast("Timer ended · "+trunc(s.plan,40)); }
      return;
    }
    if(prefs.chime>0){
      var per=prefs.chime*60, k=Math.floor(s.elapsedSec/per);
      if(k>=1){ var key=s.blockId+":"+k;
        if(_chimed!==key && (s.elapsedSec-k*per)<5){ _chimed=key; chime(); toast(hmin(k*prefs.chime)+" on "+trunc(s.plan,40)); } }
    }
  }

  // ---------------- actions ----------------
  async function run(fn){ if(busy) return; busy=true; try{ await fn(); }catch(e){ console.log(e); } busy=false; await refresh(); }

  async function closeActive(at){
    var s=status(); if(!s.on || !st.active_block_id) return;
    var mins=Math.max(1, Math.round((at.getTime()-s.startMs)/60000));
    await dbUpd("blocks", {status:"logged", logged_at:at.toISOString(), actual:s.plan||null, interval_min:mins, mode:"stopwatch"},
                {id:st.active_block_id});
  }
  async function clearState(){
    await dbUpd("state", {active_session_id:null, active_block_id:null, block_index:0, block_plan:null,
      block_total:0, due_at:null, paused:false, pause_remaining:0}, {user_id:UID});
  }
  // the core: be on `plan` from now. Closes whatever was running first.
  async function startOn(plan, taskId){
    plan=(plan||"").trim(); if(!plan) return;
    var at=new Date();
    var tid = (taskId!=null) ? taskId : findTask(plan);
    var sid, idx;
    if(st && st.active_session_id){
      await closeActive(at);
      sid=st.active_session_id; idx=(st.block_index||1)+1;
    } else {
      var ses=await dbIns("sessions", {interval_min:0, started_at:at.toISOString()});
      sid=ses.data.id; idx=1;
    }
    var payload={session_id:sid, block_index:idx, planned:plan, status:"open",
      planned_at:at.toISOString(), due_at:at.toISOString(), interval_min:0, mode:"stopwatch"};
    if(tid) payload.task_id=tid;
    var b=await dbIns("blocks", payload);
    await dbUpd("state", {active_session_id:sid, active_block_id:b.data.id, block_index:idx, block_plan:plan,
      block_total:0, due_at:at.toISOString(), paused:false, pause_remaining:0, mode:"stopwatch"}, {user_id:UID});
    $("plan").value=""; _chimed="";
  }
  function switchTo(plan, taskId){ run(function(){ return startOn(plan, taskId); }); }
  function startTyped(){
    var v=$("plan").value.trim(); if(!v) return;
    var t=findTaskFuzzy(v);
    if(t){ switchTo(t.name, t.id); return; }
    run(async function(){
      var r=await dbIns("tasks", {name:cap(v), status:"open", tag:"adhoc"});
      if(r.data && !TASKS.some(function(x){ return x.id===r.data.id; })) TASKS.unshift(r.data);
      MIRROR.tasks=TASKS.slice(); saveMirror();
      await startOn(cap(v), r.data ? r.data.id : null);
    });
  }
  function goOff(){
    run(async function(){
      if(!st || !st.active_session_id) return;
      var at=new Date();
      await closeActive(at);
      await dbUpd("sessions", {ended_at:at.toISOString()}, {id:st.active_session_id});
      await clearState();
      toast("Off.");
    });
  }
  function activeTaskRow(s){
    if(s.taskId){ var byId=TASKS.filter(function(x){ return x.id===s.taskId; })[0]; if(byId) return byId; }
    return TASKS.filter(function(x){ return (x.name||"").trim().toLowerCase()===s.plan.toLowerCase(); })[0]||null;
  }
  function doneNow(){
    var s=status(); if(!s.on) return;
    var t=activeTaskRow(s);
    run(async function(){
      var at=new Date();
      await closeActive(at);
      await dbUpd("sessions", {ended_at:at.toISOString()}, {id:st.active_session_id});
      await clearState();
      if(t){
        await dbUpd("tasks", {status:"done", completed_at:at.toISOString()}, {id:t.id});
        TASKS=TASKS.filter(function(x){ return x.id!==t.id; }); MIRROR.tasks=TASKS.slice(); saveMirror();
        var f=frogToday();
        if(f && !f.done && f.title.trim().toLowerCase()===t.name.trim().toLowerCase()) await eatFrog();
      }
      toast(t ? "Done ✓ "+trunc(t.name,30) : "Done ✓");
    });
  }
  function discardSession(){
    if(!st || !st.active_session_id) return;
    if(!confirm("Discard this block? Nothing will be recorded.")) return;
    run(async function(){
      var sid=st.active_session_id, bid=st.active_block_id;
      if(bid) await dbDel("blocks", {id:bid});
      var rest;
      if(offlineNow()) rest=(MIRROR.blocks||[]).filter(function(x){ return x.session_id===sid && x.id!==bid; });
      else { var r=await SB.from("blocks").select("id").eq("session_id",sid).limit(1); rest=r.data||[]; }
      if(!rest.length) await dbDel("sessions", {id:sid});
      else await dbUpd("sessions", {ended_at:new Date().toISOString()}, {id:sid});
      await clearState();
      toast("Discarded — nothing recorded.");
    });
  }
  function delEntry(it){ run(async function(){ await dbDel("blocks", {id:it.id}); }); }
  function finishTask(t){
    var s=status();
    if(s.on && isActiveTask(t,s)){ doneNow(); return; }
    run(async function(){
      await dbUpd("tasks", {status:"done", completed_at:new Date().toISOString()}, {id:t.id});
      TASKS=TASKS.filter(function(x){ return x.id!==t.id; });
      MIRROR.tasks=TASKS.slice(); saveMirror();
      render();
      toast("Done ✓ "+trunc(t.name,30));
    });
  }
  function addTask(){
    var v=$("taskAdd").value.trim(); if(!v) return;
    $("taskAdd").value="";
    run(async function(){
      var r=await dbIns("tasks", {name:cap(v), status:"open", tag:"adhoc"});
      if(r.data && !TASKS.some(function(x){ return x.id===r.data.id; })) TASKS.unshift(r.data);
      MIRROR.tasks=TASKS.slice(); saveMirror();
      render(); toast("Task added");
    });
  }
  async function setFrog(title){
    title=(title||"").trim(); if(!title || !FROG_OK) return;
    try{
      var t=frogToday();
      if(t){ await dbUpd("frogs", {title:title, done:false, done_at:null}, {id:t.id}); Object.assign(t,{title:title,done:false,done_at:null}); }
      else { var r=await dbIns("frogs", {day:dayKey(), title:title, done:false});
             if(r.data && !FROGS.some(function(f){ return f.id===r.data.id; })) FROGS.push(r.data); }
      MIRROR.frogs=FROGS.slice(); saveMirror(); render();
      toast("🐸 Frog set — eat it early.");
    }catch(e){ console.log(e); }
  }
  async function eatFrog(){
    var t=frogToday(); if(!t) return;
    try{
      await dbUpd("frogs", {done:true, done_at:new Date().toISOString()}, {id:t.id});
      t.done=true; t.done_at=new Date().toISOString();
      MIRROR.frogs=FROGS.slice(); saveMirror(); render();
      toast("🐸 Frog swallowed — the worst is behind you.");
    }catch(e){ console.log(e); }
  }
  function hhmm(v){ if(!v) return null; var p=v.split(":"); if(p.length<2) return null;
    var d=new Date(); d.setHours(parseInt(p[0],10), parseInt(p[1],10), 0, 0); return d; }
  function addPast(desc, startHM, endHM){
    run(async function(){
      var s=hhmm(startHM), e=hhmm(endHM);
      if(!s||!e||e<=s){ toast("Check the start and end times."); return; }
      var mins=Math.max(1, Math.round((e.getTime()-s.getTime())/60000));
      var t=findTaskFuzzy(desc);
      var ses=await dbIns("sessions", {started_at:s.toISOString(), ended_at:e.toISOString(), interval_min:mins});
      var payload={session_id:ses.data.id, block_index:1, planned:t?t.name:(desc||"(past entry)"), status:"logged",
        planned_at:s.toISOString(), due_at:s.toISOString(), logged_at:e.toISOString(),
        interval_min:mins, mode:"stopwatch", actual:t?t.name:(desc||null)};
      if(t) payload.task_id=t.id;
      await dbIns("blocks", payload);
      toast("Logged "+hmin(mins)+" ✓");
    });
  }

  // ---------------- wiring ----------------
  document.addEventListener("click", unlockAudio);
  document.addEventListener("touchstart", unlockAudio, {once:true});

  $("loginBtn").addEventListener("click", doLogin);
  $("password").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
  $("offBoot").addEventListener("click", function(){
    var cu=null; try{ cu=localStorage.getItem("cadlite_uid"); }catch(e){}
    if(cu) bootOffline(cu);
  });
  $("signOut").addEventListener("click", function(){
    try{ localStorage.removeItem("cadlite_uid"); }catch(e){}
    OFFBOOT=false; $("settings").classList.add("hidden"); SB.auth.signOut();
  });

  $("goBtn").addEventListener("click", startTyped);
  $("plan").addEventListener("keydown", function(e){ if(e.key==="Enter") startTyped(); });
  $("doneBtn").addEventListener("click", doneNow);
  $("offBtn").addEventListener("click", goOff);
  $("discardBtn").addEventListener("click", discardSession);
  $("moreBtn").addEventListener("click", function(){ prefs.showAll=!prefs.showAll; savePrefs(); render(); });

  $("taskAddBtn").addEventListener("click", addTask);
  $("taskAdd").addEventListener("keydown", function(e){ if(e.key==="Enter") addTask(); });

  $("pastToggle").addEventListener("click", function(){ $("pastBox").classList.toggle("hidden"); });
  $("pCancel").addEventListener("click", function(){ $("pastBox").classList.add("hidden"); });
  $("pLog").addEventListener("click", function(){
    var d=$("pDesc").value.trim();
    addPast(d, $("pStart").value, $("pEnd").value);
    $("pDesc").value=""; $("pStart").value=""; $("pEnd").value="";
    $("pastBox").classList.add("hidden");
  });

  $("gear").addEventListener("click", function(){ $("settings").classList.remove("hidden"); });
  $("setDone").addEventListener("click", function(){ $("settings").classList.add("hidden"); });
  $("vFull").addEventListener("click", function(){ switchVersion("full"); });
  $("vLite").addEventListener("click", function(){ switchVersion("lite"); });
  $("thDark").addEventListener("click", function(){ prefs.theme="dark"; savePrefs(); applyPrefs(); });
  $("thLight").addEventListener("click", function(){ prefs.theme="light"; savePrefs(); applyPrefs(); });
  $("swSound").addEventListener("change", function(){ prefs.sound=this.checked; savePrefs(); render(); });
  document.querySelectorAll("#chimeSeg button").forEach(function(b){
    b.addEventListener("click", function(){ prefs.chime=parseInt(b.dataset.chime,10); savePrefs(); applyPrefs(); render(); });
  });

  window.addEventListener("online", function(){
    toast("Back online — syncing…"); obBadge();
    drainOutbox().then(function(){ if(!OB.ops.length){ refresh(); refreshExt(); } });
  });
  window.addEventListener("offline", obBadge);

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  if(!REDIRECTING) init();
</script>
</body>
